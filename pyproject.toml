[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "conix"
version = "0.1.0"
description = "Single-source durable PayToPlay collection observer"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "eth-abi==6.0.0",
    "eth-utils==6.0.0",
    "eth-hash[pycryptodome]==0.8.0",
    "eth-typing==6.0.0",
]

[project.scripts]
conix = "conix.commands:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
