[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "conix"
version = "0.1.0"
description = "Strict ABI foundation for a generic EVM raw-log indexer"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "eth-abi==6.0.0",
    "eth-utils==6.0.0",
    "eth-hash[pycryptodome]==0.8.0",
    "eth-typing==6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
