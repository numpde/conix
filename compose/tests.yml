# Disposable owner initialization and installed generic journal tests.
# Runtime/reader containers never receive the schema-owner credential.
services:
  postgres:
    image: ${CONIX_POSTGRES_IMAGE:?reviewed pinned PostgreSQL image is required}
    pull_policy: never
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: conix-disposable-admin
      POSTGRES_DB: conix_test
    user: "999:999"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    tmpfs:
      - /var/run/postgresql:rw,nosuid,nodev,noexec,uid=999,gid=999,mode=0700,size=16m
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=16m
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -h, "127.0.0.1", -U, postgres, -d, conix_test]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [tests]

  # Test-only Anvil; the scanner does not submit transactions or use Anvil RPC.
  # No ports reach the host or another network.
  anvil:
    image: ${CONIX_FOUNDRY_IMAGE:?reviewed Foundry image is required}
    pull_policy: never
    entrypoint: ["/usr/local/bin/anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "31337"]
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=0700,uid=65532,gid=65532,size=32m
    healthcheck:
      test: [CMD, "/usr/local/bin/cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [tests]

  bootstrap:
    image: ${CONIX_POSTGRES_IMAGE:?reviewed pinned PostgreSQL image is required}
    pull_policy: never
    user: "999:999"
    read_only: true
    environment:
      PGPASSWORD: conix-disposable-admin
      HOME: /tmp
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        psql -X -v ON_ERROR_STOP=1 -h postgres -U postgres -d conix_test <<'SQL'
        REVOKE ALL ON DATABASE conix_test FROM PUBLIC;
        REVOKE ALL ON SCHEMA public FROM PUBLIC;
        CREATE ROLE conix_owner WITH LOGIN PASSWORD 'conix-disposable-owner'
          NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
        CREATE ROLE conix_runtime WITH LOGIN PASSWORD 'conix-disposable-runtime'
          NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
        CREATE ROLE conix_reader WITH LOGIN PASSWORD 'conix-disposable-reader'
          NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
        GRANT CONNECT ON DATABASE conix_test TO conix_owner, conix_runtime, conix_reader;
        CREATE SCHEMA conix AUTHORIZATION conix_owner;
        GRANT USAGE ON SCHEMA conix TO conix_runtime, conix_reader;
        CREATE SCHEMA ledger AUTHORIZATION postgres;
        CREATE TABLE ledger.operator_private (secret text);
        SQL
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=8m
    networks: [tests]

  initializer:
    image: ${CONIX_TEST_RUNNER_IMAGE:?select exact installed test image}
    pull_policy: never
    environment:
      CONIX_TEST_OWNER_DSN: postgresql://conix_owner:conix-disposable-owner@postgres:5432/conix_test
    entrypoint: [python, -m, unittest, discover, -s, /tests, -p, test_schema_owner.py, -v]
    user: "65532:65532"
    read_only: true
    init: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    networks: [tests]

  tests:
    image: ${CONIX_TEST_RUNNER_IMAGE:?select exact installed test image}
    pull_policy: never
    environment:
      CONIX_TEST_DSN: postgresql://conix_runtime:conix-disposable-runtime@postgres:5432/conix_test
      CONIX_TEST_READ_DSN: postgresql://conix_reader:conix-disposable-reader@postgres:5432/conix_test
      CONIX_TEST_ANVIL_URL: http://anvil:8545
    user: "65532:65532"
    read_only: true
    init: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    networks: [tests]

networks:
  tests:
    internal: true

volumes:
  pgdata: {}
