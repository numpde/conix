name: Stress-capture branch checks

on:
  push:
    branches: [work/network-rate-fixtures-20261115]

permissions:
  contents: read

jobs:
  host-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile project and capture sources
        run: python -m compileall -q src tests tools repository_checks
      - name: Run offline repository contracts
        run: make test/repository/run
