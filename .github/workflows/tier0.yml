name: conix Tier 0 checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  installed-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile source (no acquisition)
        run: python -m compileall -q src tests tools repository_checks
      - name: Qualify host-side Docker context and teardown contracts
        run: make test/repository/run
      - name: Acquire pinned images and hashed wheelhouse; build and test offline
        run: |
          make image/python-base/acquire DOCKER_CONTEXT=default
          make image/postgres/acquire DOCKER_CONTEXT=default
          make image/dockerfile-frontend/acquire DOCKER_CONTEXT=default
          # A fresh, operator-owned pool; the published tool and wheels are
          # shared flat files. Every selector/build uses the same Docker context.
          pool="$RUNNER_TEMP/conix-shared-wheelhouse"
          mkdir -m 700 "$pool"
          make wheelhouse/acquire DOCKER_CONTEXT=default WHEELHOUSE="$pool"
          # A second warm check MUST use no network, no downloads.
          make wheelhouse/check DOCKER_CONTEXT=default WHEELHOUSE="$pool"
          runtime="$(make -s image/indexer/build DOCKER_CONTEXT=default WHEELHOUSE="$pool")"
          make image/indexer/check DOCKER_CONTEXT=default IMAGE="$runtime"
          test_image="$(make -s image/test-runner/build DOCKER_CONTEXT=default WHEELHOUSE="$pool")"
          make test/postgres/run DOCKER_CONTEXT=default RUNNER_IMAGE="$test_image"
          make image/foundry/acquire DOCKER_CONTEXT=default
          fixture_image="$(make -s image/evm-test-runner/build DOCKER_CONTEXT=default WHEELHOUSE="$pool")"
          make image/evm-test-runner/check DOCKER_CONTEXT=default IMAGE="$fixture_image"
          # Stage the real distribution's fixed inputs in a private engine volume.
          # A second, unprivileged, read-only container proves readability.
          candidate="$(mktemp)"
          dsn="$(mktemp)"
          trap 'rm -f -- "$candidate" "$dsn"' EXIT
          cp examples/conix.toml "$candidate"
          printf '%s\n' 'postgresql://fixture:disposable@postgres:5432/conix_test' > "$dsn"
          make test/input-staging/run DOCKER_CONTEXT=default INDEXER_IMAGE="$runtime" \
            CONFIG_FILE="$candidate" DSN_FILE="$dsn"
          # Render the actual production profile without creating resources.
          make deployment/config/check DOCKER_CONTEXT=default \
            DEPLOYMENT=ci INDEXER_IMAGE="$runtime" \
            INPUT_VOLUME="conix-inputs-aaaaaaaaaaaaaaaaaaaaaaaa" \
            DATABASE_NETWORK="payment-db" RPC_NETWORK="payment-rpc"
