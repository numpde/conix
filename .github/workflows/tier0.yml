name: conix Tier 0 checks

on:
  push:
    branches: [20261108-tier0-executable-core]
  pull_request:

jobs:
  installed-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile source (no acquisition)
        run: python -m compileall -q src tests repository_checks
      - name: Qualify host-side Docker context and teardown contracts
        run: make check/container
      - name: Acquire pinned images and hashed wheelhouse; build and test offline
        run: |
          make deps/images/prepare DOCKER_CONTEXT=default
          wheelhouse="$(make -s deps/wheelhouse/build DOCKER_CONTEXT=default)"
          runtime="$(make -s image/build DOCKER_CONTEXT=default WHEELHOUSE_IMAGE="$wheelhouse")"
          make image/smoke DOCKER_CONTEXT=default CONIX_IMAGE="$runtime"
          test_image="$(make -s tests/image/build DOCKER_CONTEXT=default WHEELHOUSE_IMAGE="$wheelhouse")"
          make tests/container DOCKER_CONTEXT=default CONIX_TEST_IMAGE="$test_image"
          # Stage the real distribution's fixed inputs in a private engine volume.
          # A second, unprivileged, read-only container proves readability.
          candidate="$(mktemp)"
          dsn="$(mktemp)"
          trap 'rm -f -- "$candidate" "$dsn"' EXIT
          cp examples/conix.toml "$candidate"
          printf '%s\n' 'postgresql://fixture:disposable@postgres:5432/conix_test' > "$dsn"
          make inputs/proof DOCKER_CONTEXT=default CONIX_IMAGE="$runtime" \
            CONIX_CONFIG_FILE="$candidate" CONIX_DSN_FILE="$dsn"
          # Render the actual production profile without creating resources.
          CONIX_IMAGE="$runtime" \
          CONIX_INPUT_VOLUME="conix-inputs-aaaaaaaaaaaaaaaaaaaaaaaa" \
          CONIX_DATABASE_NETWORK="payment-db" CONIX_RPC_NETWORK="payment-rpc" \
            docker compose --env-file /dev/null -p conix-ci -f compose/runtime.yml \
              config --quiet
