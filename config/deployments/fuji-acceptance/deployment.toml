# Read-only Fuji acceptance source. DSNs are disposable local fixture credentials.
version = 1
docker_context = "agentic"
wheelhouse = "/home/ra/Downloads/wheelhouse"
database_network = "conix-fuji-acceptance-fixture_tests"
rpc_network = "conix-fuji-acceptance-fixture_rpc"

[chain]
chain_id = 43113
genesis_hash = "0x31ced5b9beb7f8782b014660da0cb18cc409f121f408186886e1ca3e8eeca96b"
start_block = 60737751
rpc_url = "http://gateway:8080"

[limits]
rpc_timeout_seconds = 5
operation_timeout_seconds = 30
max_response_bytes = 1048576
max_connections = 4
max_page_size = 100
max_evidence_blocks = 64
max_logs_per_block = 10000
max_abi_bytes = 1048576
max_abi_nesting = 8
max_abi_elements = 4096

[contracts.payment]
address = "0xfd4daafcae28b7037ccb87d54b89c657e79be19f"
abi_file = "abi/pay_to_play.json"
events = ["ChannelClosing(uint256,uint256)", "ChannelCreated(uint256,address,uint64)", "CollectorChanged(uint256,address,address)", "EIP712DomainChanged()", "Funded(address,uint256,uint256)", "Moved(address,uint256,uint256,uint256)", "OwnershipTransferStarted(address,address)", "OwnershipTransferred(address,address)", "PayeeChanged(uint256,address,address)", "PositionClosing(address,uint256,uint256)", "PositionRenewed(address,uint256,uint256)", "RefundRecipientChanged(address,uint256,address)", "Refunded(address,uint256,address,uint256)", "VoucherCollected(address,uint256,address,uint256,uint256,bytes32)", "VoucherKeyRegistered(address,uint256,address)", "WithdrawalRequested(address,uint256,uint256,uint256)", "Withdrawn(address,uint256,uint256)"]
